<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lucas's Arcade</title>
<meta name="theme-color" content="#2b2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lucas's Arcade">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/arcade.css">
</head>
<body>
<div id="app">
  <div class="stars" aria-hidden="true"></div>
  <header>
    <div class="marquee">
      <h1><span class="l1">Lucas's</span><span class="l2">ARCADE</span></h1>
    </div>
    <button id="muteBtn" class="round-btn" aria-label="Sound on/off"></button>
  </header>

  <!-- WHO'S PLAYING? (local-only player login) -->
  <section id="who" class="hidden">
    <!-- pick a player -->
    <div id="whoList" class="who-view">
      <h2 class="who-title">Who's playing?</h2>
      <div id="playerTiles" class="player-grid"></div>
    </div>
    <!-- make a new player -->
    <div id="whoNew" class="who-view hidden">
      <button class="back-btn" data-back aria-label="Back">&larr;</button>
      <h2 class="who-title" id="newTitle">New player</h2>
      <label class="field-label" for="nameInput">Your name</label>
      <input id="nameInput" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false">
      <div class="field-label">Pick your picture</div>
      <div id="avatarGrid" class="avatar-grid"></div>
      <button id="nameNext" class="big-btn">Next</button>
    </div>
    <!-- secret code -->
    <div id="whoCode" class="who-view hidden">
      <button class="back-btn" data-back aria-label="Back">&larr;</button>
      <div id="codeAvatar"></div>
      <h2 class="who-title" id="codeTitle">Type your secret code</h2>
      <p id="codeHint" class="code-hint">&nbsp;</p>
      <div id="dots" class="dots"><i></i><i></i><i></i><i></i></div>
      <div id="pad" class="pad"></div>
    </div>
  </section>

  <main id="arcade" class="hidden">
    <div id="playerBar">
      <span id="meAvatar"></span>
      <span id="hiName">Hi!</span>
      <button id="switchBtn" class="pill-btn">Switch player</button>
    </div>

    <h2 class="section">Pick a game!</h2>
    <div id="games" class="grid"></div>

    <h2 class="section"><span id="shelfOwner">Trophy Shelf</span> <span id="trophyCount"></span></h2>
    <div id="shelf"></div>
  </main>
  <footer>Made by Lucas &amp; Dad</footer>
</div>

<script src="js/storage.js"></script>
<script src="js/sfx.js"></script>
<script src="js/prizes.js"></script>
<script src="js/avatars.js"></script>
<script src="js/games.js"></script>
<script src="js/arcade.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
  }
</script>
</body>
</html>
