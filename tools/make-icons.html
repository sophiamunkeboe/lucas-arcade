<!doctype html>
<!-- Helper used to draw the app icons + game thumbnail.
     Open with ?what=icon, ?what=thumb or ?what=avatar&dog=bella|marley in headless Chrome and screenshot (see README). -->
<html><body style="margin:0;background:#000">
<canvas id="c" width="512" height="512" style="display:block"></canvas>
<script src="../games/pop-the-dog/dogs.js"></script>
<script>
const what = new URLSearchParams(location.search).get('what') || 'icon';
const c = document.getElementById('c'), x = c.getContext('2d');
function corn(cx, cy, s) {
  x.save(); x.translate(cx, cy); x.scale(s, s);
  x.fillStyle = '#e2c98e'; [[-8,-6,12],[8,-6,12],[0,6,12],[-10,6,9],[10,6,9]].forEach(([a,b,r]) => { x.beginPath(); x.arc(a,b,r+2,0,7); x.fill(); });
  x.fillStyle = '#fffbea'; [[-8,-6,12],[8,-6,12],[0,6,12],[-10,6,9],[10,6,9]].forEach(([a,b,r]) => { x.beginPath(); x.arc(a,b,r,0,7); x.fill(); });
  x.fillStyle = '#e7a93f'; x.beginPath(); x.ellipse(0, 9, 4, 3, 0, 0, 7); x.fill(); x.restore();
}
Promise.all([PTD.load('bella'), PTD.load('marley')]).then(([b, m]) => {
  if (what === 'avatar') {   // ?what=avatar&dog=bella  -> 512x512 head-and-shoulders picture
    const id = new URLSearchParams(location.search).get('dog') || 'bella';
    x.fillStyle = id === 'bella' ? '#bfe3ff' : '#ffd9a8'; x.fillRect(0, 0, 512, 512);
    x.save(); x.translate(256 - 200 * 1.2, 512 - 395 * 1.2); x.scale(1.2, 1.2);
    PTD.draw(x, id, id === 'bella' ? b : m, PTD.pose('stand'), { face: 'normal', time: 0.25 }); x.restore();
    document.title = 'done'; return;
  }
  const g = x.createRadialGradient(256, 200, 40, 256, 256, 360);
  if (what === 'icon') { g.addColorStop(0, '#ff6fa8'); g.addColorStop(1, '#5a3fa8'); }
  else { g.addColorStop(0, '#ffe28a'); g.addColorStop(1, '#ff8a3d'); }
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  // rays
  x.save(); x.translate(256, 230); x.fillStyle = 'rgba(255,255,255,.12)';
  for (let i = 0; i < 12; i++) { x.rotate(Math.PI / 6); x.beginPath(); x.moveTo(0,0); x.lineTo(-40, -420); x.lineTo(40, -420); x.fill(); }
  x.restore();
  const drawDog = (id, imgs, cx, s, face) => { x.save(); x.translate(cx, 470); x.scale(s, s); x.translate(-200, -410);
    PTD.draw(x, id, imgs, PTD.pose('stand'), { face, time: 0.25 }); x.restore(); };
  if (what === 'icon') {
    drawDog('marley', m, 345, 0.62, 'happy');
    drawDog('bella', b, 170, 0.62, 'normal');
  } else {
    drawDog('bella', b, 256, 0.95, 'happy');
  }
  [[90,110,1.6],[420,100,1.4],[256,70,1.8],[60,300,1.2],[460,300,1.3]].forEach(([a,bb,s]) => corn(a, bb, s));
  document.title = 'done';
});
</script></body></html>
